name: Deploy Doubao Watermark Lab

on:
  push:
    branches: [main]
    paths:
      - "doubao-watermark-lab/**"
      - ".github/workflows/deploy-doubao-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage doubao static site
        run: |
          mkdir -p ./_doubao-pages
          cp -r ./doubao-watermark-lab/* ./_doubao-pages/
          ls -la ./_doubao-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_doubao-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
